data:
  directory: data/processed/xgboost/common
  development_file: development.npz
  fold_manifest: splits/common_folds.parquet
  input_key: X
  label_key: y
  id_key: sample_id
  feature_names_key: feature_names
model:
  random_state: 42
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 1.0
threshold:
  split: grouped_out_of_fold
  method: minimize_worst_browser_fpr
  minimum_recall: 0.99
  value: 0.8549129962921143
output:
  model_directory: models/xgboost
  predictions_file: outputs/xgboost/predictions.parquet
  experiment_directory: experiments/xgboost
