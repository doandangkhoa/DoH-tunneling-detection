name: Scaffold checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check project structure and TODO IDs
        run: python scripts/verify_repository.py
      - name: Check source syntax
        run: python -m compileall -q src dashboard
